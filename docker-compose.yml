version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: assetflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-assetflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assetflow_secret}
      POSTGRES_DB: ${DB_NAME:-assetflow_enterprise}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-assetflow}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: assetflow_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@assetflow.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  pgdata:
